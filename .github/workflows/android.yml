# يبني الـ APK على سيرفرات GitHub (بدون Android Studio عندك)
# - كل push على main: APK (موقّع لو أضفت الـ secrets، وإلا debug)
# - tag مثل v1.5.0: APK + AAB ويرفعهم في صفحة Releases
name: Build Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Android project
        run: |
          if [ ! -d android/app ]; then npx cap add android; fi
          npm run android:assets
          npx cap sync android
          chmod +x android/gradlew

      - name: Signing key
        env:
          KS_B64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NEXUS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No NEXUS_KEYSTORE_BASE64 secret, building debug APK"
          fi

      - name: Patch android
        run: node scripts/patch-android.mjs

      - name: Build
        env:
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ "$SIGNED" = "1" ]; then ./gradlew assembleRelease bundleRelease --no-daemon
          else ./gradlew assembleDebug --no-daemon; fi

      - name: Collect
        run: |
          mkdir -p dist
          V=$(node -p "require('./package.json').version")
          find android/app/build/outputs -name '*.apk' -exec cp {} dist/ \;
          find android/app/build/outputs -name '*.aab' -exec cp {} dist/ \;
          cd dist && for f in *; do mv "$f" "GitHubNexus-v$V-${f#app-}"; done; ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: GitHubNexus-android
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
